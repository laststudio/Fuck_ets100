name: 'Fetch latest resolver/cloud SOs'
description: '从 ets_resolver 最新 Release 下载 libresolver.so / libcloud.so，校验后覆盖到 jniLibs'
inputs:
  token:
    description: '可读取 ets_resolver 私有仓库的 GitHub Token'
    required: true
  so-repo:
    description: '解析器 so 所在仓库'
    required: false
    default: 'laststudio/ets_resolver'
  release-tag:
    description: '指定 so 版本标签（留空使用最新 Release）'
    required: false
    default: ''
  jni-libs-dir:
    description: 'arm64 so 目标目录'
    required: false
    default: 'app/src/main/jniLibs/arm64-v8a'
outputs:
  resolver-tag:
    description: '实际使用的 ets_resolver Release 标签'
    value: ${{ steps.fetch.outputs.resolver_tag }}
runs:
  using: composite
  steps:
    - name: Download and verify SOs
      id: fetch
      shell: bash
      env:
        SO_TOKEN: ${{ inputs.token }}
        SO_REPO: ${{ inputs.so-repo }}
        SO_TAG: ${{ inputs.release-tag }}
        JNI_DIR: ${{ inputs.jni-libs-dir }}
      run: |
        set -euo pipefail
        if [ -z "${SO_TOKEN}" ]; then
          echo "缺少读取 ${SO_REPO} 的 GitHub Token" >&2
          exit 1
        fi
        rm -rf so_dist
        mkdir -p so_dist
        if [ -n "${SO_TAG}" ]; then
          TAG="${SO_TAG}"
        else
          TAG="$(GH_TOKEN="${SO_TOKEN}" gh release view --repo "${SO_REPO}" --json tagName --jq .tagName)"
        fi
        echo "resolver_tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "使用 ${SO_REPO} 的解析器版本：${TAG}"
        GH_TOKEN="${SO_TOKEN}" gh release download "${TAG}" \
          --repo "${SO_REPO}" \
          --pattern 'libresolver.so' \
          --pattern 'libcloud.so' \
          --dir so_dist \
          --clobber
        if ! GH_TOKEN="${SO_TOKEN}" gh release download "${TAG}" \
          --repo "${SO_REPO}" \
          --pattern 'SHA256SUMS.txt' \
          --dir so_dist \
          --clobber; then
          echo "Release ${TAG} 缺少 SHA256SUMS.txt，无法校验下载产物" >&2
          exit 1
        fi
        expected_resolver="$(awk '$2 ~ /\/?libresolver\.so$/ {print $1; exit}' so_dist/SHA256SUMS.txt)"
        expected_cloud="$(awk '$2 ~ /\/?libcloud\.so$/ {print $1; exit}' so_dist/SHA256SUMS.txt)"
        if [ -z "${expected_resolver}" ] || [ -z "${expected_cloud}" ]; then
          echo "SHA256SUMS.txt 中找不到 libresolver.so / libcloud.so 条目" >&2
          exit 1
        fi
        actual_resolver="$(sha256sum so_dist/libresolver.so | awk '{print $1}')"
        actual_cloud="$(sha256sum so_dist/libcloud.so | awk '{print $1}')"
        if [ "${actual_resolver}" != "${expected_resolver}" ] || [ "${actual_cloud}" != "${expected_cloud}" ]; then
          echo "so 下载校验失败：resolver 期望 ${expected_resolver} 实际 ${actual_resolver}；cloud 期望 ${expected_cloud} 实际 ${actual_cloud}" >&2
          exit 1
        fi
        mkdir -p "${JNI_DIR}"
        cp so_dist/libresolver.so so_dist/libcloud.so "${JNI_DIR}/"
        rm -rf so_dist
        for so in libresolver libcloud; do
          file "${JNI_DIR}/${so}.so" | grep -q 'ELF 64-bit LSB shared object'
          readelf -s "${JNI_DIR}/${so}.so" 2>/dev/null | grep -q JNI_OnLoad \
            || nm -D --defined-only "${JNI_DIR}/${so}.so" 2>/dev/null | grep -q JNI_OnLoad
        done
        sha256sum "${JNI_DIR}/libresolver.so" "${JNI_DIR}/libcloud.so"
