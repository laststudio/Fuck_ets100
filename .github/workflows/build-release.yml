name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fe-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_RELEASE_REPOSITORY: laststudio/Fuck_ets100

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 离线版默认使用仓库内置的 libresolver.so（含 0x126ad0 授权跳过补丁）。
      # 上游正式版习惯用 ets_resolver 最新 SO 覆盖；这里改成显式开关，
      # 避免再次把补丁 SO 覆盖成未打补丁版本导致解析不可用。
      - name: Fetch latest resolver/cloud SOs
        if: vars.FE_FETCH_LATEST_SO == 'true'
        id: resolver
        uses: ./.github/actions/fetch-latest-resolver
        with:
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > keystore.jks
          ls -la keystore.jks

      - name: Derive expected signing certificate SHA256
        id: sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore keystore.jks \
            -alias "${ANDROID_KEY_ALIAS}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -file signing.der 2>/dev/null
          SHA=$(openssl dgst -sha256 -hex signing.der | awk '{print $2}')
          echo "signature_sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "derived sha256=${SHA}"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNATURE_SHA256: ${{ steps.sign.outputs.signature_sha256 }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify bundled resolver patch
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < scripts/release/expected_resolver.sha256)"
          apk="app/build/outputs/apk/release/app-release.apk"
          actual="$(unzip -p "$apk" lib/arm64-v8a/libresolver.so | sha256sum | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "libresolver.so 与预期补丁版本不一致：expected=$expected actual=$actual" >&2
            echo "离线版禁止用未打补丁的 SO 覆盖 jniLibs（检查 fetch-latest-resolver / FE_FETCH_LATEST_SO）。" >&2
            exit 1
          fi
          echo "bundled resolver patch verified: $actual"

      - name: Verify artifacts
        run: |
          ls -la app/build/outputs/apk/release/
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          VCODE=$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)
          SHA_SHORT=${GITHUB_SHA::11}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VCODE}" >> "$GITHUB_OUTPUT"
          echo "ci_tag=v${VERSION}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "public_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=Fe_${VERSION}.apk" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Fe_${VERSION}.apk"

      - name: Publish CI Build to Fe-pro
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.ci_tag }}
          name: "Fe ${{ steps.meta.outputs.ci_tag }}"
          body: "解析器内核：ets_resolver ${{ steps.resolver.outputs.resolver_tag || 'bundled (repo jniLibs)' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/${{ steps.meta.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate public release notes
        run: |
          set -euo pipefail
          python scripts/release/extract_changelog.py \
            --version "${{ steps.meta.outputs.version }}" \
            --apk-url "https://lastudio.cc/dl/Fe/latest" \
            --release-notes release_notes.md \
            --changelog-output current_changelog.md
          printf '\n---\n\n解析器内核：ets_resolver %s\n' "${{ steps.resolver.outputs.resolver_tag || 'bundled (repo jniLibs)' }}" >> release_notes.md

      - name: Publish Official Release to Fuck_ets100
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.public_tag }}"
          APK="release/${{ steps.meta.outputs.apk_name }}"
          if gh release view "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${PUBLIC_RELEASE_REPOSITORY}, updating notes and asset..."
            gh release edit "${TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --title "Fe ${TAG}" \
              --notes-file release_notes.md \
              --latest
            gh release upload "${TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --clobber \
              "${APK}"
          else
            echo "Creating new release ${TAG} in ${PUBLIC_RELEASE_REPOSITORY}..."
            gh release create "${TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --target public \
              --title "Fe ${TAG}" \
              --notes-file release_notes.md \
              --latest \
              "${APK}"
          fi

      - name: Install LanZou dependencies
        run: python -m pip install --upgrade requests requests-toolbelt

      - name: Upload APK to LanZouCloud
        env:
          LANZOU_USERNAME: ${{ secrets.LANZOU_USERNAME }}
          LANZOU_PASSWORD: ${{ secrets.LANZOU_PASSWORD }}
          LANZOU_FOLDER_NAME: ${{ vars.LANZOU_FOLDER_NAME || 'fe' }}
        run: |
          set -euo pipefail
          python scripts/release/upload_lanzou.py \
            --file "release/${{ steps.meta.outputs.apk_name }}" \
            --folder-name "${LANZOU_FOLDER_NAME}"

      - name: 同步远程配置仓库
        continue-on-error: true
        shell: bash
        env:
          LASTUDIO_PUBLISHER_TOKEN: ${{ secrets.LASTUDIO_PUBLISHER_TOKEN }}
          CONFIG_GITHUB_TOKEN: ${{ secrets.CONFIG_GITHUB_TOKEN }}
          CONFIG_GITHUB_REPO: ${{ vars.CONFIG_GITHUB_REPO || 'laststudio/Fe_config' }}
          CONFIG_GITHUB_BRANCH: ${{ vars.CONFIG_GITHUB_BRANCH || 'main' }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_CONFIG_REPO: ${{ vars.GITEE_CONFIG_REPO || 'qiuqiqiuqid/fe_config' }}
          GITEE_CONFIG_BRANCH: ${{ vars.GITEE_CONFIG_BRANCH || 'master' }}
        run: |
          set -euo pipefail
          if [ -z "${LASTUDIO_PUBLISHER_TOKEN:-}" ]; then
            echo "缺少 LASTUDIO_PUBLISHER_TOKEN，跳过远程配置同步。"
            exit 0
          fi
          python scripts/release/update_remote_config.py \
            --version-code "${{ steps.meta.outputs.version_code }}" \
            --version-name "${{ steps.meta.outputs.version }}" \
            --apk-url "https://lastudio.cc/dl/Fe/latest" \
            --message-file release_notes.md \
            --local-config-file config/config.json \
            --source-changelog-file update.md

      - name: 发送 OneBot 群通知
        continue-on-error: true
        shell: bash
        env:
          ONEBOT_HTTP_URL: ${{ secrets.ONEBOT_HTTP_URL }}
          ONEBOT_GROUP_ID: ${{ secrets.ONEBOT_GROUP_ID }}
          ONEBOT_ACCESS_TOKEN: ${{ secrets.ONEBOT_ACCESS_TOKEN }}
          ONEBOT_INSECURE_TLS: ${{ vars.ONEBOT_INSECURE_TLS || '1' }}
        run: |
          set -euo pipefail
          if [ -z "${ONEBOT_HTTP_URL:-}" ] || [ -z "${ONEBOT_GROUP_ID:-}" ]; then
            echo "OneBot 配置不完整，跳过群通知。"
            exit 0
          fi
          {
            echo "新版本发布啦喵~"
            echo "最新版本为${{ steps.meta.outputs.version }}"
            echo "前往下载:https://lastudio.cc/dl/Fe/latest"
            echo
            echo "更新日志:"
            sed -E '/^##[[:space:]]+/d; /^>[[:space:]]*内部版本号/d; /^[[:space:]]*$/d' current_changelog.md
          } > onebot_message.txt
          python scripts/release/notify_onebot.py \
            --api-url "${ONEBOT_HTTP_URL}" \
            --group-id "${ONEBOT_GROUP_ID}" \
            --message-file onebot_message.txt \
            --upload-file "https://github.com/${PUBLIC_RELEASE_REPOSITORY}/releases/download/${{ steps.meta.outputs.public_tag }}/${{ steps.meta.outputs.apk_name }}" \
            --upload-name "${{ steps.meta.outputs.apk_name }}" \
            --access-token "${ONEBOT_ACCESS_TOKEN:-}"

